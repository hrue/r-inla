########################################################################
# Build the INLA R package and guard the metadata a release depends on.
#
# The other workflow builds the inla BINARY bundles; nothing built the R
# package, so the only way to get one was to run the release steps by hand
# on a workstation. That makes "install the package from this branch" and
# "install the released package" two different artifacts that nobody can
# diff. This job produces the tarball on every run, so the branch and the
# release are the same file built the same way.
#
# It deliberately does NOT publish, tag, or write to the repository. The
# release itself stays a manual step; this only removes the guesswork about
# what the package contains and stops two metadata mistakes from reaching
# a release unnoticed.
########################################################################
name: r-package

on:
  push:
    ## master is here because a release is cut from it, and nothing else on
    ## this repository tests it: build-inla runs on feature/ci and on tags, so
    ## master went straight from a merge to a tag with no check in between.
    ## That is how a merge that broke R CMD build reached master and was only
    ## noticed when the release failed. This job is one short ubuntu run, so
    ## the cost of covering master is small and it catches exactly that class
    ## of failure BEFORE the tag exists rather than after.
    branches: [feature/ci, master]
    tags: ['Version_*', 'v*']
  workflow_dispatch:

jobs:
  build:
    name: "R package: guards + tarball"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ## Guards below compare against the nearest reachable tag, which a
          ## shallow clone does not have.
          fetch-depth: 0

      ## GUARD 1: the version in DESCRIPTION must be the one this commit
      ## implies. The build scripts compile that same string into the binary
      ## (GITCOMMIT/INLA_TAG), so a stale DESCRIPTION silently mislabels both
      ## halves at once. This exact field once sat thirteen months behind
      ## while releases went out, which is what this step exists to prevent.
      ## master and tags only. The version says which day's code a RELEASE
      ## contains, and releases come from master, so that is where it has to be
      ## right. Checking it on feature/ci turned every ordinary day's first
      ## push red for a field that means nothing on a development branch.
      - name: Version is current
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: bash ci/bump-rinla-version.sh --check

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      ## No dependency install: R CMD build does not load the package, and
      ## vignettes are skipped, so nothing from Depends/Suggests is needed.
      ## Verified by building the same tarball on a machine without them.

      - name: Build the package
        run: |
          set -o pipefail
          R CMD build --no-build-vignettes rinla | tee build-package.log
          ls -1 INLA_*.tar.gz

      ## GUARD 2, tags only: a release must have a NEWS entry for its own
      ## version. NEWS.md is written by hand on purpose (the entries are
      ## curated summaries, not commit subjects), so this checks only that
      ## the section exists, never what it says.
      - name: NEWS has an entry for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(sed -n 's/^Version:[[:space:]]*//p' rinla/DESCRIPTION | head -1)
          if ! grep -qE "^#[[:space:]]*INLA[[:space:]]+${VER}([[:space:]]|$)" rinla/NEWS.md; then
            echo "::error::rinla/NEWS.md has no '# INLA $VER' section for this release"
            echo "  newest entries currently in NEWS.md:"
            grep -m5 -E "^#[[:space:]]*INLA" rinla/NEWS.md || true
            exit 1
          fi
          echo "NEWS.md carries an entry for $VER"

      - name: Report what was built
        run: |
          VER=$(sed -n 's/^Version:[[:space:]]*//p' rinla/DESCRIPTION | head -1)
          {
            echo "### INLA R package"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| version | \`$VER\` |"
            echo "| tarball | \`$(ls -1 INLA_*.tar.gz)\` |"
            echo "| commit  | \`${GITHUB_SHA:0:9}\` |"
            echo ""
            echo "The inla binaries built by the other workflow report this same"
            echo "version, since the build scripts read it from DESCRIPTION."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inla-r-package
          path: INLA_*.tar.gz
          if-no-files-found: error

  ## Install the package the way a WINDOWS user has to, and drive the one
  ## function that only they exercise.
  ##
  ## Windows cannot use remotes::install_github() at all: that unpacks the raw
  ## repository, and tar.exe refuses its ~211 symlinks. So Windows users install
  ## the built tarball, and nothing in CI ever did that, which is how
  ## inla.stiles.install() shipped looking for the binary only under bin/ while
  ## the Windows zip is flat and puts inla.exe at the top level. It failed with
  ## "no 'inla.exe' found" against a directory that plainly contained it.
  ##
  ## This job is the missing coverage: real Windows, real tarball, real
  ## download and unpack, then assert that inla.call points at a file that
  ## exists. It needs the network and the newest release, so it is allowed to
  ## fail without blocking: a release outage must not turn the board red.
  windows-install:
    name: "Windows: install the tarball and fetch a binary"
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inla-r-package

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install the tarball, then fetch the binary
        shell: Rscript {0}
        run: |
          tb <- list.files(".", pattern = "^INLA_.*\\.tar\\.gz$", full.names = TRUE)[1]
          stopifnot(!is.na(tb))
          cat("tarball:", tb, "\n")

          ## repos = NULL does no dependency resolution, so install them first.
          install.packages(c("Matrix", "fmesher", "lifecycle", "rlang",
                             "withr", "MatrixModels"))
          install.packages(tb, repos = NULL, type = "source")

          library(INLA)
          cat("attached INLA", as.character(packageVersion("INLA")), "\n")

          INLA::inla.stiles.install(persist = FALSE)

          call <- INLA::inla.getOption("inla.call")
          cat("inla.call =", format(call), "\n")
          if (is.null(call) || !nzchar(call) || !file.exists(call)) {
              stop("inla.stiles.install() did not leave a usable inla.call")
          }
          out <- suppressWarnings(system2(call, "-ping", stdout = TRUE, stderr = TRUE))
          cat(paste(out, collapse = "\n"), "\n")
          if (!any(grepl("ALIVE", out))) stop("the installed binary did not answer -ping")
          cat("OK: install + binary\n")

          ## Which binary did we just download? This job installs the RELEASED
          ## artifact, on purpose: it tests what a user actually gets. So it
          ## lags the branch, and until a release carries the fix below it
          ## would fail on every single run for a reason that has nothing to do
          ## with the commit being tested. That is noise, and noise gets
          ## ignored, so decide from the artifact's own BUILDINFO instead.
          ##
          ## The rgeneric crash on Windows was caused by two R.dll copies in
          ## one process: the exe imported R's Rblas/Rlapack, which import
          ## R.dll, so the bundled copy loaded at startup while rgeneric
          ## dlopened the user's R through R_HOME. The build now uses a static
          ## OpenBLAS and ships no R library at all, and the BLAS line in
          ## BUILDINFO is what says which of the two this binary is. The check
          ## goes live by itself on the first release built the new way.
          bi <- c(file.path(dirname(call), "BUILDINFO"),
                  file.path(dirname(dirname(call)), "BUILDINFO"))
          bi <- bi[file.exists(bi)]
          blas <- NA_character_
          if (length(bi)) {
              L <- readLines(bi[1], warn = FALSE)
              hit <- grep("^[[:space:]]*blas:", L, value = TRUE)
              if (length(hit)) blas <- trimws(hit[1])
          }
          cat("released binary BLAS:", if (is.na(blas)) "(no BUILDINFO)" else blas, "\n")

          if (is.na(blas) || !grepl("OpenBLAS", blas, ignore.case = TRUE)) {
              cat("\nSKIP: this release predates the Windows rgeneric fix.\n")
              cat("      It ships R's Rblas/Rlapack, so inla.exe imports R.dll and\n")
              cat("      a second R.dll is mapped when rgeneric loads the user's R.\n")
              cat("      demo(rgeneric) segfaults on it, which is expected and is\n")
              cat("      not a fault of this commit. The branch build is tested by\n")
              cat("      build-inla's Windows job, against the binary it just built.\n")
              cat("      This check runs for real once a release ships OpenBLAS.\n")
              quit(save = "no", status = 0)
          }

          ## rgeneric is the one feature where the BINARY calls back into R: it
          ## dlopens libR through R_HOME (bin/x64/R.dll on Windows) and
          ## evaluates the model's R function per iteration. Ordinary models
          ## never touch that path, so they can all pass while rgeneric is
          ## broken, which is what happens on Windows while macOS is fine.
          ## Nothing in CI exercised it, so nothing caught it.
          ##
          ## The check is the demo's own oracle: fit the same iid model twice,
          ## once through rgeneric and once with the built-in, and require the
          ## marginal likelihoods to agree. A wrong answer fails as loudly as a
          ## crash, which a "did it run" test would not.
          cat("R_HOME =", Sys.getenv("R_HOME"), "\n")

          ## Run the SHIPPED demo, not a copy of it: demo(rgeneric) is what a
          ## user runs and what is reported broken, so a re-implementation here
          ## could pass while the real thing fails. demo() evaluates in the
          ## global environment, so r1 and r2 are available afterwards for the
          ## check below.
          ## safe mode retries a failed fit and reports "the inla program
          ## crashed", which hides the binary's own stderr. Turn it off so the
          ## first failure is the one we see.
          INLA::inla.setOption(safe = FALSE)

          res <- try(demo("rgeneric", package = "INLA", character.only = TRUE,
                          echo = TRUE, ask = FALSE), silent = TRUE)
          if (inherits(res, "try-error")) {
              cat("\n==== demo(rgeneric) failed ====\n")
              cat("message:", conditionMessage(attr(res, "condition")), "\n")

              ## Every earlier attempt at this read the binary's STDOUT, and it
              ## told us nothing: three runs of the same failure cut the trace at
              ## three different points (fixed1, PRIOR1->, PRIOR0->PARAMETE),
              ## which is the stdio buffer being lost when the process dies, not
              ## the crash moving. Meanwhile the binary reports its own errors on
              ## STDERR, and that is the channel this test was discarding:
              ## capture.output(type = "output") takes stdout only, and the
              ## non-verbose path sends stderr to a file nothing printed.
              ##
              ## There WAS a symbol probe here using getNativeSymbolInfo().
              ## It was worse than useless: that function searches only the
              ## DLLs registered in R's own table, and R.dll is not one, so it
              ## reported MISSING for every symbol including ones objdump shows
              ## exported. Three separate runs were read as evidence of missing
              ## symbols before that was caught. Removed rather than fixed:
              ## objdump on the artifact answers the question properly.

              ## Run the binary ourselves, keeping stderr.
              ## keep = TRUE leaves the model files behind; inla() is invoked from
              ## the parent directory with a relative ini path, so the same form
              ## works here.
              set.seed(1)
              nn <- 50
              dd2 <- data.frame(y = rnorm(nn), idx = 1:nn)
              rg <- INLA::inla.rgeneric.define(INLA::inla.rgeneric.iid.model, n = nn)
              try(INLA::inla(y ~ -1 + f(idx, model = rg), data = dd2,
                             control.family = list(hyper = list(prec = list(initial = 12, fixed = TRUE))),
                             keep = TRUE), silent = TRUE)

              ini <- list.files(".", pattern = "^Model\\.ini$", recursive = TRUE,
                                full.names = TRUE)[1]
              cat("\n---- direct run of the binary ----\n")
              if (is.na(ini)) {
                  cat("keep = TRUE left no Model.ini behind\n")
              } else {
                  cat("ini:", ini, "\n")
                  ## INLA_DEBUG_R makes R-interface.c print "R-interface: init"
                  ## on stderr AFTER the embedded R starts. Its presence or
                  ## absence splits the problem in half: absent means the binary
                  ## dies at or before loading R, present means R embeds fine and
                  ## the fault is in a later callback.
                  Sys.setenv(INLA_DEBUG_R = "1")
                  st <- suppressWarnings(
                      system2(call, c("-v", "-P", "compact", "-t1:1", ini),
                              stdout = "out.txt", stderr = "err.txt"))
                  cat("\n-- stderr (the channel that carries the error) --\n")
                  if (file.exists("err.txt")) {
                      writeLines(readLines("err.txt", warn = FALSE))
                  }
                  cat("-- last 15 lines of stdout --\n")
                  if (file.exists("out.txt")) {
                      writeLines(utils::tail(readLines("out.txt", warn = FALSE), 15))
                  }
                  ## The exit code is the one fact no buffer can swallow.
                  ## On Windows: 3221225477 (0xC0000005) access violation,
                  ## 3221226356 (0xC0000374) heap corruption, 3 abort(),
                  ## 1 a clean exit(1) from the loader checks above.
                  cat("\nexit status =", st, "\n")
              }
              cat("==== end diagnostics ====\n")

              stop("demo(rgeneric) failed: ", conditionMessage(attr(res, "condition")))
          }

          ## The demo's own oracle: the same iid model fitted through rgeneric
          ## and with the built-in must give the same marginal likelihood. A
          ## wrong answer has to fail as loudly as a crash, because INLA's safe
          ## mode can turn a broken model into a message rather than an error.
          if (!exists("r1") || !exists("r2")) stop("demo(rgeneric) produced no fits")
          if (is.null(r1$mlik) || is.null(r2$mlik)) stop("demo(rgeneric) produced no mlik")
          dd <- abs(r1$mlik[1] - r2$mlik[1])
          cat("mlik built-in =", r1$mlik[1], "  rgeneric =", r2$mlik[1], "  diff =", dd, "\n")
          if (!is.finite(dd) || dd > 0.5) stop("rgeneric disagrees with the built-in iid: diff = ", dd)
          cat("OK: demo(rgeneric) works on Windows\n")
