## Re-run the failed jobs of a red build-inla run, once, automatically.
##
## Most red boards are a download that failed for a few minutes (a package
## mirror crawling, a 504 from a GitHub release, GitLab under load), not the
## code. A second attempt of only the failed jobs passes, and on a tag the
## release job then publishes as usual. A job that fails twice is treated as
## a real error and left red.
##
## GitHub runs workflow_run workflows from the DEFAULT branch only, so this
## file takes effect once it is on devel.
name: rerun-failed

on:
  workflow_run:
    workflows: [build-inla]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "build-inla run ${{ github.event.workflow_run.id }} (${{ github.event.workflow_run.head_branch }}) failed; retrying its failed jobs"
          gh run rerun "${{ github.event.workflow_run.id }}" --failed -R "${{ github.repository }}"
